name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/galiver/galiver-affiliate-frontend
            git pull
            npm install
            npm run build
            /root/.nvm/versions/node/v22.22.3/bin/pm2 restart galiver-affiliate-frontend
